name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight UTC
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contributions Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-bright.svg?palette=github-light
            dist/ocean.gif?color_snake=#C0C0C0&color_dots=#0F2027,#203A43,#2C5364,#4E8CC7,#89C2FF&color_background=#0F2027
            dist/github-snake.svg?color_snake=#C0C0C0&color_dots=#0F2027,#203A43,#2C5364,#4E8CC7,#89C2FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C0C0C0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
