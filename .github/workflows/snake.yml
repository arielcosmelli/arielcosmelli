name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate GitHub Contributions Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9CA3AF&color_dots=#0A192F,#112240,#1B2A41,#233554,#2F81F7
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9CA3AF&color_dots=#0A192F,#112240,#1B2A41,#233554,#2F81F7&color_background=#0D1117
            dist/github-contribution-grid-snake-light.svg?color_snake=#6B7280&color_dots=#BBDFFF,#80C8FF,#4FA3F7,#2F81F7,#1F6FEB&color_background=#FFFFFF
            dist/ocean.gif?color_snake=#9CA3AF&color_dots=#0A192F,#112240,#1B2A41,#233554,#2F81F7&color_background=#0D1117
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
